<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#04050b" />
    <meta name="description" content="A burning calendar for Brazil: 20+ years of NASA FIRMS fire hotspots, harmonized across MODIS and VIIRS." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Brazil Fire Calendar: NASA fire hotspots for Brazil since 2003" />
    <meta property="og:description" content="MODIS and VIIRS hotspots on one scale, as a calendar of every month for any area in Brazil." />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <title>Brazil Fire Calendar</title>
    <!-- the theme (dark unless the visitor chose light) and the page colour, before any stylesheet arrives -->
    <script>
      try {
        if (localStorage.getItem('bfc.theme') === 'light') {
          document.documentElement.dataset.theme = 'light';
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f2f3f7');
        }
      } catch (e) {}
    </script>
    <style>
      html, body { margin: 0; background: #04050b; color: #f4f5f8; }
      html[data-theme='light'], html[data-theme='light'] body { background: #f2f3f7; color: #14151a; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
