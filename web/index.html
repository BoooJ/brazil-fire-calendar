<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#16110f" />
    <meta name="description" content="A burning calendar for Brazil: 20+ years of NASA FIRMS fire hotspots, harmonized across MODIS and VIIRS." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="FOGO, Fire Occurrence Grid Outlook: NASA fire hotspots for Brazil since 2003" />
    <meta property="og:description" content="MODIS and VIIRS hotspots on one scale, as a calendar of every month for any area in Brazil." />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <title>FOGO · Fire Occurrence Grid Outlook</title>
    <!-- the page colour before any stylesheet arrives -->
    <style>
      html, body { margin: 0; background: #f5f5f7; color: #1d1d1f; }
      /* the loading screen: the seal and the full name on the logo's dark ground until the page is ready
         (src/splash.ts fades it away). The two SVGs are written in by vite.config.ts from src/brand.ts. */
      #splash { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: #16110f; color: #f2682a; transition: opacity .5s cubic-bezier(.22, 1, .36, 1), visibility 0s linear .5s; }
      #splash.is-gone { opacity: 0; visibility: hidden; pointer-events: none; }
      #splash .splash-mark { display: grid; justify-items: center; gap: clamp(20px, 4vmin, 32px); padding: 24px; animation: splash-breathe 1.6s ease-in-out infinite; }
      #splash .splash-seal { display: block; width: clamp(132px, 30vmin, 208px); height: auto; }
      #splash .splash-name { display: block; width: clamp(232px, 62vw, 400px); height: auto; overflow: visible; }
      @keyframes splash-breathe { 50% { opacity: .6; } }
      @media (prefers-reduced-motion: reduce) { #splash { transition: none; } #splash .splash-mark { animation: none; } }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Loading FOGO, Fire Occurrence Grid Outlook">
      <div class="splash-mark"><!--brand:seal--><!--brand:name--></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
