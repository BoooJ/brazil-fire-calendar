<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f5f7" />
    <meta name="description" content="A burning calendar for Brazil: 20+ years of NASA FIRMS fire hotspots, harmonized across MODIS and VIIRS." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Brazil Fire Calendar: NASA fire hotspots for Brazil since 2003" />
    <meta property="og:description" content="MODIS and VIIRS hotspots on one scale, as a calendar of every month for any area in Brazil." />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <title>Brazil Fire Calendar</title>
    <!-- the page colour before any stylesheet arrives (both pages are dark) -->
    <style>
      html, body { margin: 0; background: #f5f5f7; color: #1d1d1f; }
      /* the loading screen: the name in the middle until the page is ready (src/splash.ts fades it away) */
      #splash { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: #fff; transition: opacity .5s cubic-bezier(.22, 1, .36, 1), visibility 0s linear .5s; }
      #splash.is-gone { opacity: 0; visibility: hidden; pointer-events: none; }
      #splash .splash-name { display: inline-flex; align-items: center; gap: 10px; font: 600 clamp(22px, 4vw, 30px)/1 'Inter Variable', Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; letter-spacing: -0.025em; color: #1d1d1f; animation: splash-breathe 1.6s ease-in-out infinite; }
      @keyframes splash-breathe { 50% { opacity: .55; } }
      @media (prefers-reduced-motion: reduce) { #splash { transition: none; } #splash .splash-name { animation: none; } }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Loading Brazil Fire Calendar">
      <div class="splash-name">
        <svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path fill="#ff6a1f" d="M12 2c1 3.5-1.5 5-3 7-1.6 2-2.5 3.7-2.5 6A5.5 5.5 0 0 0 12 20.5 5.5 5.5 0 0 0 17.5 15c0-2-.8-3.3-1.8-4.6-.3 1.3-1 2.2-2 2.6.6-3.5-.2-7.5-1.7-11z" /><path fill="#ffd166" d="M12 20.5c-1.7 0-3-1.3-3-3 0-1.5 1-2.5 3-4.5 2 2 3 3 3 4.5 0 1.7-1.3 3-3 3z" /></svg>
        Brazil Fire Calendar
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
